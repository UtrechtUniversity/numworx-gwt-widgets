intro=Als voorbereiding op de mijlpaalopdracht moet je nog wat extra oefenen met onderstaande leerdoelen. Als je geoefend hebt, klik je op de terug-knop om terug te keren naar de lijst. Als je voldoende geoefend hebt, verdwijnen de leerdoelen uit de lijst en kun je door naar de mijlpaalopdracht. 
allok=Het lijkt erop dat je alle kennis en vaardigheden hebt om deze activiteit te maken. Je kunt gerust beginnen met deze activiteit.
header=Persoonlijke aanbeveling