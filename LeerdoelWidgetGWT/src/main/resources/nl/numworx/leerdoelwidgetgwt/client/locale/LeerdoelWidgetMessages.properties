intro=Het lijkt erop dat je nog niet alle kennis en vaardigheden hebt om deze \
 actviteit te maken. Hieronder staat een lijstje met de kennis en vaardigheden \
 die je nog lijkt te beheersen. Bij elke vaardigheid staat een link naar de theorie\
 en een link naar extra oefeningen waarmee je vaardigheden kunt \
 opwaarderen.
 allok=Het lijkt erop dat je alle kennis en vaardigheden hebt om deze activiteit te maken.\
 Je kunt gerust beginnen met deze activiteit